name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Build UIKit paths for the iOS simulator
        run: xcodebuild -scheme CeburuAnalyticsSDK -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ceburu-ios" CODE_SIGNING_ALLOWED=NO build -quiet
